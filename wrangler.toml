name = "cakesnmore"
main = "worker/index.ts"
compatibility_date = "2026-09-25"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*", "/sitemap.xml", "/robots.txt"]

[[d1_databases]]
binding = "DB"
database_name = "cakesnmore"
database_id = "80ca6af3-c589-4bbf-8921-45ed43a3fc74"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cakesnmore"

[vars]
ADMIN_EMAIL = "admin@cakesnmorenoida.in"